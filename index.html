<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>漢字 · Каллиграфия</title>

    <meta name="description" content="Тренажёр китайской каллиграфии с примерами слов и озвучкой">
    <meta name="theme-color" content="#1e1a17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="漢字">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">

    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
    <script src="hanzi-db.js"></script>

    <style>
        :root {
            --bg-color: #1e1a17;
            --paper-color: #f7f2e9;
            --ink-color: #2b221b;
            --accent-green: #4CD964;
            --accent-red: #FF3B30;
            --accent-gold: #D4A840;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg-color);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans', system-ui, sans-serif;
            touch-action: none;
            padding: 0.5rem;
        }
        html { height: -webkit-fill-available; }

        .game-container {
            background: var(--paper-color);
            background-image: radial-gradient(circle at 20% 30%, #fdfaf5 0%, #efe6d8 100%);
            padding: 0.8rem 1rem 1rem;
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 2px #b8a58b inset;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            position: relative;
        }

        /* Верхняя панель */
        .hero-panel {
            background: linear-gradient(135deg, #fffaf0 0%, #f5ead8 100%);
            border-radius: 1.5rem;
            padding: 1rem 1.2rem;
            box-shadow: 0 4px 0 #d6c4b0, 0 8px 20px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            border: 2px solid #e8dcc4;
        }
        .hero-panel:active {
            transform: scale(0.98);
            box-shadow: 0 2px 0 #d6c4b0;
        }
        .hero-panel::after {
            content: '🔊';
            position: absolute;
            top: 0.6rem;
            right: 0.8rem;
            font-size: 1.1rem;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .hero-panel:hover::after { opacity: 0.9; }

        .hero-top-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.3rem;
        }
        .hero-char {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(3rem, 12vw, 4.5rem);
            color: var(--ink-color);
            line-height: 1;
            transition: color 0.3s;
            flex-shrink: 0;
        }
        .hero-meta {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.25rem;
            min-width: 0;
        }
        .hero-pinyin {
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            color: #8a4a2a;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 0.5px;
        }
        .hero-meaning {
            font-size: clamp(1rem, 3.5vw, 1.3rem);
            color: #4a6a4a;
            font-weight: 600;
            line-height: 1.2;
        }
        .hero-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px dashed #d6c4b0;
            margin-top: 0.3rem;
            flex-wrap: wrap;
        }
        .hero-streak {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: linear-gradient(135deg, #ff9f1c, #ff6b6b);
            color: white;
            padding: 0.25rem 0.7rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(255, 107, 107, 0.3);
        }
        .hero-category {
            font-size: 0.8rem;
            color: #6a5a4a;
            font-weight: 600;
        }
        .hero-menu-btn {
            background: #dacfc1;
            border: none;
            border-radius: 0.8rem;
            padding: 0.4rem 0.9rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--ink-color);
            box-shadow: 0 3px 0 #aa9884;
            cursor: pointer;
            transition: all 0.1s;
        }
        .hero-menu-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #aa9884;
        }

        /* Холст */
        .writer-wrapper {
            background: #fcf8f0;
            border-radius: 1.5rem;
            box-shadow: 0 6px 0 #baaa92, 0 12px 28px rgba(0,0,0,0.15);
            padding: 0.5rem;
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            transition: transform 0.1s;
        }
        .writer-wrapper.shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        #hw-container { width: 100%; height: 100%; border-radius: 1rem; position: relative; }
        #hw-container svg { width: 100% !important; height: 100% !important; display: block; }

        .instruction {
            text-align: center;
            font-size: 0.85rem;
            color: #6a5a4a;
            font-style: italic;
            min-height: 1.2em;
        }

        .char-status {
            position: absolute;
            top: 0.7rem;
            right: 0.7rem;
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 0.6rem;
            font-weight: 700;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .char-status.new { background: #d6c4b0; color: #5a4a3a; }
        .char-status.learning { background: #ffd166; color: #2a1a0a; }
        .char-status.due { background: #ff6b6b; color: white; animation: pulse 1.5s infinite; }
        .char-status.mastered { background: #4CD964; color: white; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .stroke-progress {
            width: 100%;
            height: 8px;
            background: #ddd0c0;
            border-radius: 4px;
            overflow: hidden;
        }
        .stroke-progress-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 0.3s ease-out;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ede3d6;
            padding: 0.5rem 0.8rem;
            border-radius: 1rem;
            font-weight: 700;
            font-size: 0.9rem;
            color: #3d3229;
            gap: 0.5rem;
        }
        .stats-bar-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .combo-badge {
            background: var(--accent-gold);
            color: #2a1a0a;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .combo-badge.active { opacity: 1; transform: scale(1); }

        .controls { display: flex; gap: 0.6rem; }
        .btn {
            flex: 1;
            background: #dacfc1;
            border: none;
            border-radius: 1rem;
            padding: 0.7rem;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--ink-color);
            box-shadow: 0 4px 0 #aa9884;
            transition: all 0.1s ease, opacity 0.2s;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #aa9884; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-primary { background: #c9b39b; box-shadow: 0 4px 0 #8e7b66; }
        .btn-hint { background: #8fb88a; color: #1f2a1c; box-shadow: 0 4px 0 #5f7a5a; flex: 0.5; }
        .btn-examples { background: #b8a8d8; color: #2a1a3a; box-shadow: 0 4px 0 #8a7aa8; flex: 0.5; }

        .floating-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 800;
            color: var(--accent-gold);
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            white-space: nowrap;
        }
        .floating-text.show { animation: floatUp 1s ease-out forwards; }
        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -60%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -100%) scale(1); }
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; padding: 1rem; backdrop-filter: blur(4px);
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--paper-color);
            border-radius: 1.5rem;
            padding: 1.2rem;
            max-width: 420px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-height: 85vh;
            display: flex; flex-direction: column;
        }
        .modal h2 { font-size: 1.2rem; color: var(--ink-color); margin-bottom: 0.8rem; text-align: center; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
        }
        .stat-card {
            background: #ede3d6;
            border-radius: 0.8rem;
            padding: 0.6rem;
            text-align: center;
        }
        .stat-card-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--ink-color);
            line-height: 1;
        }
        .stat-card-label {
            font-size: 0.7rem;
            color: #6a5a4a;
            margin-top: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card.highlight {
            background: linear-gradient(135deg, #d4a84a, #c9953a);
            color: #2a1a0a;
        }
        .stat-card.highlight .stat-card-value,
        .stat-card.highlight .stat-card-label { color: #2a1a0a; }

        .mode-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
        }
        .mode-btn {
            background: #ede3d6;
            border: 2px solid transparent;
            border-radius: 0.9rem;
            padding: 0.7rem 0.5rem;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--ink-color);
        }
        .mode-btn:active { transform: scale(0.97); }
        .mode-btn:hover { background: #e4d8c4; }
        .mode-btn-icon { font-size: 1.5rem; display: block; margin-bottom: 0.2rem; }
        .mode-btn-desc {
            font-size: 0.7rem;
            color: #6a5a4a;
            font-weight: 400;
            margin-top: 0.15rem;
        }

        .search-wrapper { position: relative; margin-bottom: 0.8rem; }
        .search-input {
            width: 100%; padding: 0.7rem 2.5rem 0.7rem 2.5rem;
            font-size: 0.95rem; font-family: inherit;
            background: #fcf8f0; border: 2px solid #d6c4b0;
            border-radius: 1rem; color: var(--ink-color);
            outline: none; transition: all 0.2s;
        }
        .search-input:focus { border-color: var(--accent-gold); background: #fff; box-shadow: 0 0 0 3px rgba(212, 168, 64, 0.15); }
        .search-input::placeholder { color: #a09080; }
        .search-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); font-size: 1.1rem; pointer-events: none; opacity: 0.6; }
        .search-clear {
            position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%);
            background: #d6c4b0; border: none; border-radius: 50%;
            width: 1.8rem; height: 1.8rem; font-size: 0.9rem;
            color: var(--ink-color); cursor: pointer;
            display: none; align-items: center; justify-content: center;
        }
        .search-clear.visible { display: flex; }

        .modal-scroll { overflow-y: auto; flex: 1; padding-right: 0.3rem; }
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-track { background: transparent; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #d6c4b0; border-radius: 3px; }

        .group-header { font-size: 0.8rem; color: #6a5a4a; padding: 0.5rem 0.3rem 0.3rem; margin-top: 0.5rem; border-bottom: 1px dashed #d6c4b0; text-transform: uppercase; letter-spacing: 0.5px; }
        .group-header:first-child { margin-top: 0; }
        .category-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .category-item {
            background: #ede3d6; border: 2px solid transparent; border-radius: 1rem;
            padding: 0.7rem 0.9rem; cursor: pointer; transition: all 0.15s;
            text-align: left; display: flex; align-items: center; gap: 0.6rem;
        }
        .category-item:active { transform: scale(0.98); }
        .category-item.active { border-color: var(--accent-gold); background: #f5ead8; }
        .cat-color-bar { width: 4px; height: 36px; border-radius: 2px; flex-shrink: 0; }
        .category-item-content { flex: 1; }
        .category-item-name { font-weight: 700; font-size: 1rem; color: var(--ink-color); }
        .category-item-desc { font-size: 0.78rem; color: #6a5a4a; margin-top: 0.15rem; }

        .search-results { display: flex; flex-direction: column; gap: 0.4rem; }
        .search-result-item {
            background: #fcf8f0; border: 1px solid #e0d4c0; border-radius: 0.9rem;
            padding: 0.6rem 0.8rem; cursor: pointer; transition: all 0.15s;
            display: flex; align-items: center; gap: 0.7rem;
        }
        .search-result-item:active { transform: scale(0.98); background: #f5ead8; }
        .search-result-char { font-family: 'Ma Shan Zheng', cursive; font-size: 2rem; color: var(--ink-color); line-height: 1; min-width: 2.2rem; text-align: center; }
        .search-result-info { flex: 1; display: flex; flex-direction: column; gap: 0.1rem; }
        .search-result-pinyin { font-weight: 700; color: #8a4a2a; font-size: 0.9rem; }
        .search-result-meaning { color: #4a6a4a; font-size: 0.82rem; }
        .search-result-category { font-size: 0.7rem; color: #8a7a6a; background: #ede3d6; padding: 0.15rem 0.5rem; border-radius: 0.5rem; align-self: flex-start; margin-top: 0.2rem; }
        .search-empty { text-align: center; padding: 1.5rem 1rem; color: #8a7a6a; font-size: 0.9rem; }
        .search-count { font-size: 0.75rem; color: #8a7a6a; text-align: center; padding: 0.3rem; }

        .modal-close {
            margin-top: 0.8rem; width: 100%; background: #c9b39b; border: none;
            border-radius: 1rem; padding: 0.7rem; font-weight: 700; color: var(--ink-color);
            box-shadow: 0 4px 0 #8e7b66; cursor: pointer; flex-shrink: 0;
        }
        .modal-close:active { transform: translateY(4px); box-shadow: 0 0 0 #8e7b66; }

        /* Модальное окно примеров */
        .examples-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none; justify-content: center; align-items: center;
            z-index: 1001; padding: 1rem; backdrop-filter: blur(6px);
        }
        .examples-modal.show { display: flex; }
        .examples-content {
            background: var(--paper-color);
            border-radius: 1.5rem;
            padding: 1.5rem;
            max-width: 400px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            max-height: 80vh;
            display: flex; flex-direction: column;
        }
        .examples-header {
            text-align: center;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px dashed #d6c4b0;
        }
        .examples-char {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 3rem;
            color: var(--ink-color);
            line-height: 1;
        }
        .examples-pinyin {
            font-size: 1.2rem;
            color: #8a4a2a;
            font-weight: 700;
            margin-top: 0.3rem;
        }
        .examples-meaning {
            font-size: 1rem;
            color: #4a6a4a;
            font-weight: 600;
            margin-top: 0.2rem;
        }
        .examples-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .example-item {
            background: #fcf8f0;
            border: 2px solid #e0d4c0;
            border-radius: 1rem;
            padding: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .example-item:active {
            transform: scale(0.98);
            background: #f5ead8;
            border-color: var(--accent-gold);
        }
        .example-word {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2rem;
            color: var(--ink-color);
            line-height: 1;
            min-width: 3rem;
            text-align: center;
        }
        .example-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .example-pinyin {
            font-weight: 700;
            color: #8a4a2a;
            font-size: 0.95rem;
        }
        .example-meaning {
            color: #4a6a4a;
            font-size: 0.85rem;
        }
        .example-speak {
            font-size: 1.5rem;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .example-item:hover .example-speak {
            opacity: 1;
        }
        .examples-empty {
            text-align: center;
            padding: 2rem 1rem;
            color: #8a7a6a;
            font-size: 0.9rem;
        }

        .firework-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; overflow: hidden; }
        
        @media (max-width: 400px) {
            .modal { padding: 1rem; }
            .search-result-char { font-size: 1.7rem; min-width: 1.8rem; }
            .hero-panel { padding: 0.8rem 1rem; }
            .hero-char { font-size: 3rem; }
            .hero-pinyin { font-size: 1.3rem; }
            .hero-meaning { font-size: 1rem; }
        }
        /* === БЛОК ПРОГРЕССА ИЗУЧЕНИЯ === */
.mastery-block {
    background: #fcf8f0;
    border: 2px solid #e0d4c0;
    border-radius: 1rem;
    padding: 1rem;
    margin-top: 1rem;
    text-align: center;
}
.mastery-stars {
    font-size: 1.8rem;
    letter-spacing: 2px;
    margin-bottom: 0.5rem;
}
.star-filled { color: #D4A840; text-shadow: 0 2px 4px rgba(212, 168, 64, 0.3); }
.star-empty { color: #d6c4b0; }

.mastery-bar-bg {
    width: 100%;
    height: 12px;
    background: #e0d4c0;
    border-radius: 6px;
    overflow: hidden;
    margin: 0.5rem 0;
}
.mastery-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #4CD964, #D4A840);
    border-radius: 6px;
    transition: width 0.5s ease-out;
}
.mastery-text {
    font-size: 0.85rem;
    color: #6a5a4a;
    font-weight: 600;
}
.mastery-text.mastered {
    color: #4CD964;
    font-size: 1rem;
    font-weight: 800;
}


    </style>
</head>
<body>

<div class="game-container">
    <div class="hero-panel" id="heroPanel">
        <div class="hero-top-row">
            <div class="hero-char" id="charDisplay">永</div>
            <div class="hero-meta">
                <div class="hero-pinyin" id="pinyinDisplay">yǒng</div>
                <div class="hero-meaning" id="meaningDisplay">вечный</div>
            </div>
        </div>
        <div class="hero-bottom-row">
            <div class="hero-streak" id="heroStreak">🔥 0 дней</div>
            <div class="hero-category" id="heroCategory">📚 HSK 1</div>
            <button class="hero-menu-btn" id="categoryBtn">📚 Меню</button>
        </div>
    </div>

    <div class="instruction" id="instructionText">✍️ Обведите иероглиф по порядку черт</div>

    <div class="writer-wrapper" id="writerWrapper">
        <div class="char-status new" id="charStatus">✨ НОВЫЙ</div>
        <div id="hw-container"></div>
        <div class="floating-text" id="floatingText"></div>
    </div>

    <div class="stroke-progress">
        <div class="stroke-progress-fill" id="progressFill"></div>
    </div>

    <div class="stats-bar">
        <div class="stats-bar-item">⭐ <span id="scoreDisplay">0</span></div>
        <div class="stats-bar-item">🎯 <span id="accuracyDisplay">0%</span></div>

<script>
    let currentCategory = 'basic';
    let currentCategoryName = '📚 HSK 1';
    let currentItems = [];
    let currentIndex = 0;
    let score = 0;
    let combo = 0;
    let currentStrokesTotal = 0;
    let currentStrokesCorrect = 0;
    let hwWriter = null;
    let audioCtx = null;
    let isShowingHint = false;
    let isSingleMode = false;

    const heroPanel = document.getElementById('heroPanel');
    const charDisplay = document.getElementById('charDisplay');
    const pinyinDisplay = document.getElementById('pinyinDisplay');
    const meaningDisplay = document.getElementById('meaningDisplay');
    const heroStreak = document.getElementById('heroStreak');
    const heroCategory = document.getElementById('heroCategory');
    const charStatus = document.getElementById('charStatus');
    const instructionText = document.getElementById('instructionText');
    const writerWrapper = document.getElementById('writerWrapper');
    const hwContainer = document.getElementById('hw-container');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const accuracyDisplay = document.getElementById('accuracyDisplay');
    const comboDisplay = document.getElementById('comboDisplay');
    const comboBadge = document.getElementById('comboBadge');
    const progressFill = document.getElementById('progressFill');
    const floatingText = document.getElementById('floatingText');
    const modalOverlay = document.getElementById('modalOverlay');
    const categoriesView = document.getElementById('categoriesView');
    const searchView = document.getElementById('searchView');
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    const hintBtn = document.getElementById('hintBtn');
    const examplesBtn = document.getElementById('examplesBtn');
    const examplesModal = document.getElementById('examplesModal');
    const examplesChar = document.getElementById('examplesChar');
    const examplesPinyin = document.getElementById('examplesPinyin');
    const examplesMeaning = document.getElementById('examplesMeaning');
    const examplesList = document.getElementById('examplesList');
    const statStreak = document.getElementById('statStreak');
    const statMastered = document.getElementById('statMastered');
    const statAccuracy = document.getElementById('statAccuracy');
    const statDue = document.getElementById('statDue');
    const modeDue = document.getElementById('modeDue');
    const modeWeak = document.getElementById('modeWeak');

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        initAudio();
        const now = audioCtx.currentTime;
        if (type === 'success') {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'error') {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'complete') {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.type = 'sine'; o.frequency.value = freq;
                g.gain.setValueAtTime(0.2, now + i * 0.1);
                g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.6);
                o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.6);
            });
        }
    }

    function speakCharacter(char, meaning) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const queue = [
            { text: char, lang: 'zh-CN', rate: 0.7 },
            { text: char, lang: 'zh-CN', rate: 0.7 },
            { text: meaning, lang: 'ru-RU', rate: 1.0 }
        ];
        let index = 0;
        function speakNext() {
            if (index >= queue.length) return;
            const item = queue[index];
            const utterance = new SpeechSynthesisUtterance(item.text);
            utterance.lang = item.lang;
            utterance.rate = item.rate;
            utterance.volume = 1.0;
            utterance.onend = () => { index++; setTimeout(speakNext, 400); };
            utterance.onerror = () => { index++; setTimeout(speakNext, 400); };
            window.speechSynthesis.speak(utterance);
        }
        speakNext();
    }

    function speakWord(word) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;
        utterance.volume = 1.0;
        window.speechSynthesis.speak(utterance);
    }

    function showFloatingText(text) {
        floatingText.textContent = text;
        floatingText.classList.remove('show');
        void floatingText.offsetWidth;
        floatingText.classList.add('show');
    }
    function triggerShake() {
        writerWrapper.classList.add('shake');
        setTimeout(() => writerWrapper.classList.remove('shake'), 400);
    }
    function launchFirework() {
        const container = document.getElementById('fireworkContainer');
        const colors = ['#FFD166', '#FF6B6B', '#4ECDC4', '#FF9F1C', '#B980F0'];
        for (let i = 0; i < 40; i++) {
            const el = document.createElement('div');
            const size = 6 + Math.random() * 10;
            const x = 20 + Math.random() * 60, y = 20 + Math.random() * 60;
            const color = colors[Math.floor(Math.random() * colors.length)];
            el.style.cssText = `position: absolute; left: ${x}%; top: ${y}%; width: ${size}px; height: ${size}px; background: ${color}; border-radius: 50%; pointer-events: none; animation: fireworkBurst ${0.6 + Math.random() * 0.5}s ease-out forwards;`;
            container.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }
    }

    function getWriterSize() {
        const rect = hwContainer.getBoundingClientRect();
        return Math.max(200, Math.floor(Math.min(rect.width, rect.height)));
    }

    function updateCharStatus() {
        if (currentItems.length === 0) return;
        const data = currentItems[currentIndex];
        const progress = HanziProgress.get(data.char);
        
        charStatus.classList.remove('new', 'learning', 'due', 'mastered');
        
        if (progress.mastered) {
            charStatus.classList.add('mastered');
            charStatus.textContent = '✓ ВЫУЧЕН';
        } else if (progress.attempts > 0 && progress.nextReview <= Date.now()) {
            charStatus.classList.add('due');
            charStatus.textContent = '🔄 ПОВТОРИТЬ';
        } else if (progress.attempts > 0) {
            charStatus.classList.add('learning');
            charStatus.textContent = '📖 ИЗУЧАЕМ';
        } else {
            charStatus.classList.add('new');
            charStatus.textContent = '✨ НОВЫЙ';
        }
    }

    function updateStats() {
        const stats = HanziProgress.getStats();
        const streakText = `${stats.streak} 🔥`;
        statStreak.textContent = streakText;
        heroStreak.textContent = `${stats.streak} 🔥 дней`;
        statMastered.textContent = stats.mastered;
        statAccuracy.textContent = `${stats.accuracy}%`;
        accuracyDisplay.textContent = `${stats.accuracy}%`;
        statDue.textContent = stats.dueCount;
    }

    function loadCharacter(index) {
        if (currentItems.length === 0) return;
        const data = currentItems[index];
        charDisplay.textContent = data.char;
        pinyinDisplay.textContent = data.pinyin;
        meaningDisplay.textContent = data.meaning;
        
        currentStrokesCorrect = 0;
        isShowingHint = false;
        hintBtn.disabled = false;
        hintBtn.style.opacity = '1';
        
        updateProgress(0);
        updateCharStatus();
        
        instructionText.textContent = "✍️ Обведите иероглиф по порядку черт";
        instructionText.style.color = "#6a5a4a";

        hwContainer.innerHTML = '';
        const size = getWriterSize();
        
        hwWriter = HanziWriter.create('hw-container', data.char, {
            width: size,
            height: size,
            padding: 15,
            showOutline: true,
            strokeAnimationSpeed: 1.2,
            delayBetweenStrokes: 500,
            drawingWidth: Math.max(15, size * 0.06),
            showCharacter: false,
            highlightColor: '#FF3B30',
            outlineColor: '#D1D1D6',
            drawingColor: '#1C1C1E',
            showHintAfterMisses: 1,
            highlightOnComplete: true
        });

        hwWriter.getCharacterData().then(function(charData) {
            currentStrokesTotal = charData.strokes.length;
            updateProgress(0);
        });

        hwWriter.quiz({
            onCorrectStroke: function(strokeData) {
                if (isShowingHint) return;
                currentStrokesCorrect = strokeData.strokeNum;
                combo++;
                score += 10 * combo;
                playSound('success');
                updateUI();
                updateProgress((currentStrokesCorrect / currentStrokesTotal) * 100);
                if (combo >= 3) showFloatingText(`🔥 Комбо x${combo}!`);
            },
            onMistake: function() {
                if (isShowingHint) return;
                combo = 0;
                playSound('error');
                triggerShake();
                updateUI();
                instructionText.textContent = "⚠️ Ошибка! Смотрите на красную подсказку";
                instructionText.style.color = "#8a4a2a";
            },
            onComplete: function(summaryData) {
                if (isShowingHint) return;
                playSound('complete');
                launchFirework();
                score += 100;
                const accuracy = summaryData.totalMistakes === 0 ? 100 : Math.max(0, Math.round((1 - summaryData.totalMistakes / currentStrokesTotal) * 100));
                
                if (summaryData.totalMistakes === 0) {
                    HanziProgress.recordSuccess(data.char, accuracy);
                } else {
                    HanziProgress.recordMistake(data.char, summaryData.totalMistakes);
                }
                
                updateCharStatus();
                updateStats();
                
                showFloatingText(accuracy === 100 ? '💯 Идеально!' : `✅ Готово! (${accuracy}%)`);
                
                if (isSingleMode) {
                    instructionText.textContent = "🎉 Готово! Нажмите ⏭️ для выбора следующего";
                    instructionText.style.color = "#4a6a4a";
                } else {
                    instructionText.textContent = "🎉 Отлично! Загрузка следующего...";
                    instructionText.style.color = "#4a6a4a";
                    setTimeout(() => nextCharacter(), 2500);
                }
            }
        });
    }

    function updateUI() {
        scoreDisplay.textContent = score;
        comboDisplay.textContent = combo;
        comboBadge.classList.toggle('active', combo >= 2);
    }
    function updateProgress(percent) { progressFill.style.width = `${Math.min(percent, 100)}%`; }
    
    function nextCharacter() {
        if (isSingleMode) {
            updateStats();
            updateCategoryList();
            modalOverlay.classList.add('show');
            setTimeout(() => searchInput.focus(), 100);
            return;
        }
        currentIndex = (currentIndex + 1) % currentItems.length;
        loadCharacter(currentIndex);
    }

    function loadCategory(categoryKey) {
        currentCategory = categoryKey;
        const cat = HANZI_DATABASE[categoryKey];
        currentCategoryName = cat ? cat.name : '📚 Иероглифы';
        heroCategory.textContent = currentCategoryName;
        
        currentItems = HanziDB.shuffle(HanziDB.getCategory(categoryKey));
        currentIndex = 0;
        isSingleMode = false;
        if (currentItems.length > 0) loadCharacter(0);
        updateCategoryList();
        localStorage.setItem('hanzi_category', categoryKey);
        localStorage.removeItem('hanzi_single_mode');
    }

    function loadSingleChar(charData) {
        currentCategory = null;
        currentCategoryName = '🔍 Поиск';
        heroCategory.textContent = currentCategoryName;
        currentItems = [charData];
        currentIndex = 0;
        isSingleMode = true;
        loadCharacter(0);
        localStorage.setItem('hanzi_single_mode', JSON.stringify(charData));
        localStorage.removeItem('hanzi_category');
    }

    function showHint() {
        if (!hwWriter || isShowingHint) return;
        initAudio();
        
        if (currentItems.length > 0) {
            const data = currentItems[currentIndex];
            speakCharacter(data.char, data.meaning);
        }
        
        isShowingHint = true;
        instructionText.textContent = "👀 Смотрите анимацию и слушайте...";
        instructionText.style.color = "#8a4a2a";
        hintBtn.disabled = true;
        hintBtn.style.opacity = '0.5';
        
        hwWriter.animateCharacter({
            onComplete: function() {
                setTimeout(() => {
                    isShowingHint = false;
                    loadCharacter(currentIndex);
                    showFloatingText("🔄 Начинаем заново");
                }, 800);
            }
        });
    }

        function showExamples() {
        if (currentItems.length === 0) return;
        const data = currentItems[currentIndex];
        
        // Получаем расширенные данные о прогрессе
        const progress = HanziProgress.get(data.char);
        
        examplesChar.textContent = data.char;
        examplesPinyin.textContent = data.pinyin;
        examplesMeaning.textContent = data.meaning;
        
        examplesList.innerHTML = '';
        
        // 🆕 БЛОК ПРОГРЕССА (Звёзды и полоска)
        const progressBlock = document.createElement('div');
        progressBlock.className = 'mastery-block';
        
        // Генерируем звёзды (например: ★★★☆☆)
        let starsHtml = '';
        for (let i = 1; i <= 5; i++) {
            starsHtml += i <= progress.stars ? '<span class="star-filled">★</span>' : '<span class="star-empty">☆</span>';
        }
        
        const isMastered = progress.isMastered;
        const progressText = isMastered 
            ? '🎉 Иероглиф полностью выучен!' 
            : `Прогресс: ${progress.masteryProgress}% (осталось ${progress.levelsRemaining} ур. и ${progress.successesRemaining} усп.)`;
        
        progressBlock.innerHTML = `
            <div class="mastery-stars">${starsHtml}</div>
            <div class="mastery-bar-bg">
                <div class="mastery-bar-fill" style="width: ${progress.masteryProgress}%"></div>
            </div>
            <div class="mastery-text ${isMastered ? 'mastered' : ''}">${progressText}</div>
        `;
        examplesList.appendChild(progressBlock);
        
        // Примеры слов (если есть)
        if (data.examples && data.examples.length > 0) {
            const examplesHeader = document.createElement('div');
            examplesHeader.style.cssText = 'font-size: 0.85rem; color: #6a5a4a; font-weight: 700; margin: 1rem 0 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;';
            examplesHeader.textContent = '📖 Примеры слов:';
            examplesList.appendChild(examplesHeader);

            data.examples.forEach(ex => {
                const item = document.createElement('div');
                item.className = 'example-item';
                item.innerHTML = `
                    <div class="example-word">${ex.word}</div>
                    <div class="example-info">
                        <div class="example-pinyin">${ex.pinyin}</div>
                        <div class="example-meaning">${ex.meaning}</div>
                    </div>
                    <div class="example-speak">🔊</div>
                `;
                item.addEventListener('click', () => {
                    initAudio();
                    speakWord(ex.word);
                    item.style.background = '#f5ead8';
                    setTimeout(() => { item.style.background = ''; }, 300);
                });
                examplesList.appendChild(item);
            });
        } else {
            const emptyMsg = document.createElement('div');
            emptyMsg.className = 'examples-empty';
            emptyMsg.textContent = '📖 Примеры слов для этого иероглифа пока не добавлены';
            examplesList.appendChild(emptyMsg);
        }
        
        examplesModal.classList.add('show');
    }



    function startDueReview() {
        const due = HanziProgress.getDueForReview();
        if (due.length === 0) {
            showFloatingText('🎉 Всё повторено!');
            return;
        }
        currentCategory = 'due';
        currentCategoryName = '🔄 Повторение';
        heroCategory.textContent = currentCategoryName;
        currentItems = due;
        currentIndex = 0;
        isSingleMode = false;
        loadCharacter(0);
        modalOverlay.classList.remove('show');
        showFloatingText('🔄 Режим повторения');
    }

    function startWeakSpots() {
        const weak = HanziProgress.getWeakSpots();
        if (weak.length === 0) {
            showFloatingText('✨ Нет слабых мест!');
            return;
        }
        currentCategory = 'weak';
        currentCategoryName = '🎯 Слабые места';
        heroCategory.textContent = currentCategoryName;
        currentItems = weak;
        currentIndex = 0;
        isSingleMode = false;
        loadCharacter(0);
        modalOverlay.classList.remove('show');
        showFloatingText('🎯 Слабые места');
    }

    function performSearch(query) {
        query = query.trim().toLowerCase();
        searchView.innerHTML = '';
        if (!query) {
            searchView.style.display = 'none';
            categoriesView.style.display = 'block';
            searchClear.classList.remove('visible');
            return;
        }
        searchClear.classList.add('visible');
        categoriesView.style.display = 'none';
        searchView.style.display = 'block';
        
        const results = HanziDB.search(query);
        if (results.length === 0) {
            searchView.innerHTML = `<div class="search-empty">🔍 Ничего не найдено по запросу «${escapeHtml(query)}»<br><span style="font-size:0.8rem;opacity:0.7;">Попробуйте: иероглиф, пиньинь или перевод</span></div>`;
            return;
        }
        
        const limited = results.slice(0, 50);
        const countDiv = document.createElement('div');
        countDiv.className = 'search-count';
        countDiv.textContent = results.length > 50 ? `Найдено ${results.length} · показано первые 50` : `Найдено: ${results.length}`;
        searchView.appendChild(countDiv);
        
        const list = document.createElement('div');
        list.className = 'search-results';
        limited.forEach(item => {
            const el = document.createElement('div');
            el.className = 'search-result-item';
            const categoryName = HANZI_DATABASE[item.category]?.name || '';
            el.innerHTML = `
                <div class="search-result-char">${item.char}</div>
                <div class="search-result-info">
                    <div class="search-result-pinyin">${item.pinyin}</div>
                    <div class="search-result-meaning">${item.meaning}</div>
                    <div class="search-result-category">${categoryName}</div>
                </div>
            `;
            el.addEventListener('click', () => {
                modalOverlay.classList.remove('show');
                loadSingleChar(item);
                showFloatingText(`📖 ${item.char} · ${item.pinyin}`);
                setTimeout(() => speakCharacter(item.char, item.meaning), 300);
            });
            list.appendChild(el);
        });
        searchView.appendChild(list);
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function updateCategoryList() {
        categoriesView.innerHTML = '';
        const groups = HanziDB.getCategoriesByGroup();
        if (groups.hsk.length > 0) {
            const hskHeader = document.createElement('div');
            hskHeader.className = 'group-header';
            hskHeader.innerHTML = '🎯 <strong>Уровни HSK</strong> <span style="opacity:0.6;font-size:0.75rem;">комплексно</span>';
            categoriesView.appendChild(hskHeader);
            const list = document.createElement('div'); list.className = 'category-list';
            groups.hsk.forEach(cat => list.appendChild(createCategoryItem(cat)));
            categoriesView.appendChild(list);
        }
        if (groups.topic.length > 0) {
            const topicHeader = document.createElement('div');
            topicHeader.className = 'group-header';
            topicHeader.innerHTML = '📚 <strong>Тематические</strong> <span style="opacity:0.6;font-size:0.75rem;">по темам</span>';
            categoriesView.appendChild(topicHeader);
            const list = document.createElement('div'); list.className = 'category-list';
            groups.topic.forEach(cat => list.appendChild(createCategoryItem(cat)));
            categoriesView.appendChild(list);
        }
    }

    function createCategoryItem(cat) {
        const item = document.createElement('div');
        item.className = 'category-item' + (cat.key === currentCategory ? ' active' : '');
        const colorBar = cat.color ? `<span class="cat-color-bar" style="background:${cat.color}"></span>` : '';
        item.innerHTML = `${colorBar}<div class="category-item-content"><div class="category-item-name">${cat.name}</div><div class="category-item-desc">${cat.description} · <strong>${cat.count}</strong> иероглифов</div></div>`;
        item.addEventListener('click', () => {
            loadCategory(cat.key);
            modalOverlay.classList.remove('show');
            searchInput.value = '';
            performSearch('');
        });
        return item;
    }

    heroPanel.addEventListener('click', (e) => {
        if (e.target.closest('#categoryBtn')) return;
        initAudio();
        if (currentItems.length > 0) {
            const data = currentItems[currentIndex];
            speakCharacter(data.char, data.meaning);
            charDisplay.style.color = '#8a4a2a';
            setTimeout(() => { charDisplay.style.color = ''; }, 600);
        }
    });

    document.getElementById('nextBtn').addEventListener('click', () => { initAudio(); nextCharacter(); });
    hintBtn.addEventListener('click', () => { initAudio(); showHint(); });
    examplesBtn.addEventListener('click', () => { initAudio(); showExamples(); });
    
    document.getElementById('categoryBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        updateStats();
        updateCategoryList();
        modalOverlay.classList.add('show');
        setTimeout(() => searchInput.focus(), 100);
    });
    
    document.getElementById('modalClose').addEventListener('click', () => {
        modalOverlay.classList.remove('show');
        searchInput.value = '';
        performSearch('');
    });
    
    document.getElementById('examplesClose').addEventListener('click', () => {
        examplesModal.classList.remove('show');
    });
    
    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
            modalOverlay.classList.remove('show');
            searchInput.value = '';
            performSearch('');
        }
    });
    
    examplesModal.addEventListener('click', (e) => {
        if (e.target === examplesModal) {
            examplesModal.classList.remove('show');
        }
    });

    modeDue.addEventListener('click', startDueReview);
    modeWeak.addEventListener('click', startWeakSpots);

    searchInput.addEventListener('input', (e) => performSearch(e.target.value));
    searchClear.addEventListener('click', () => { searchInput.value = ''; performSearch(''); searchInput.focus(); });
    
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (examplesModal.classList.contains('show')) {
                examplesModal.classList.remove('show');
            } else if (modalOverlay.classList.contains('show')) {
                modalOverlay.classList.remove('show');
                searchInput.value = '';
                performSearch('');
            }
        }
    });

    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            if (hwWriter && !isShowingHint) loadCharacter(currentIndex);
        }, 200);
    });

    const styleSheet = document.createElement("style");
    styleSheet.textContent = `@keyframes fireworkBurst { 0% { transform: scale(0); opacity: 1; } 50% { opacity: 1; } 100% { transform: scale(3); opacity: 0; } }`;
    document.head.appendChild(styleSheet);

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW ошибка:', err));
        });
    }

    updateStats();
    const savedSingle = localStorage.getItem('hanzi_single_mode');
    const savedCategory = localStorage.getItem('hanzi_category');
    if (savedSingle) {
        try { loadSingleChar(JSON.parse(savedSingle)); } catch(e) { loadCategory('hsk1_all'); }
    } else if (savedCategory && HANZI_DATABASE[savedCategory]) {
        loadCategory(savedCategory);
    } else {
        loadCategory('hsk1_all');
    }
</script>
</body>
</html>
